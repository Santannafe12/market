name: ci

on:
  push:
  pull_request:

jobs:
  api-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market -d market"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DATABASE_URL_TEST: postgresql://market:market@localhost:5432/market_test
          JWT_SECRET: test-jwt-secret-must-be-32-characters-min
          AUDIT_HMAC_SECRET: test-audit-hmac-secret-32-characters-min
          WEB_ORIGIN: http://localhost:5173
