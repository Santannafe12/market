<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231f2a44'/%3E%3Cpath d='M9 23h14M12 9l7 7M15 6l7 7M10 15l4-4M18 12l-7 9' stroke='%23e3c27a' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Casa de Leilões</title>
    <script>
      // Applies the saved theme before the first paint. Same key as ThemeToggle.
      (function () {
        try {
          var saved = localStorage.getItem('market.theme');
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.classList.toggle('dark', dark);
        } catch (error) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
